<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1a1d" />
  <title>Tap Match</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">
  <main class="phone-stage">
    <div class="phone">
      <div class="phone-screen">
        <div class="phone-notch"></div>

        <!-- Boyut seçimi -->
        <section id="sizeScreen" class="level-screen">
          <div class="list-head">
            <h1>Tap Match</h1>
            <div id="sizeInfo" class="pack-info"></div>
            <button id="btnDark" class="hud-btn dark-toggle" title="Açık/koyu tema">🌙</button>
          </div>
          <div class="theme-row">
            <span class="theme-label">Sticker</span>
            <div id="themeRow" class="theme-chips"></div>
          </div>
          <div class="theme-row">
            <span class="theme-label">Tarama efekti</span>
            <button id="btnScan" class="chip">Açık</button>
          </div>
          <button id="btnFavLib" class="size-card fav-lib">
            <span class="sz-name"><span class="fav-heart">♥</span> Favoriler</span>
            <span class="sz-meta" id="favLibMeta">henüz boş</span>
          </button>
          <div id="sizeGrid" class="size-grid"></div>
        </section>

        <!-- Level seçimi (seçili boyut) -->
        <section id="levelScreen" class="level-screen" hidden>
          <div class="list-head list-head-row">
            <button id="btnSizeBack" class="hud-btn" title="Boyutlar">←</button>
            <div>
              <h1 id="packTitle"></h1>
              <div id="packInfo" class="pack-info"></div>
            </div>
          </div>
          <div id="levelGrid" class="level-grid"></div>
        </section>

        <!-- Oyun ekranı -->
        <section id="playScreen" class="play-screen" hidden>
          <div class="hud">
            <button id="btnBack" class="hud-btn" title="Level listesi">←</button>
            <div class="hud-mid">
              <div id="hudLevel" class="hud-level"></div>
              <div id="hudTime" class="hud-time">00:00</div>
            </div>
            <button id="btnFav" class="hud-btn fav-btn" title="Favorilere ekle">♡</button>
            <div id="hudLives" class="hud-lives"></div>
          </div>

          <div id="viewport" class="viewport">
            <div id="camera" class="camera">
              <div id="board" class="board"></div>
            </div>
          </div>

          <div class="playbar">
            <div class="stats" id="playStats"></div>
            <div class="play-actions">
              <button id="btnHint" class="chip">İpucu</button>
              <button id="btnRestart" class="chip" title="Yeniden başlat">↻</button>
            </div>
          </div>

          <div id="winOverlay" class="win" hidden>
            <div class="win-box">
              <div class="win-title">Level tamamlandı 🎉</div>
              <div id="winStats"></div>
              <div class="win-actions">
                <button id="btnNext" class="primary">Sonraki level</button>
                <button id="btnWinFav" class="chip fav-chip">♡ Favorilere ekle</button>
                <button id="btnToList" class="chip">Level listesi</button>
              </div>
            </div>
          </div>

          <div id="failOverlay" class="win" hidden>
            <div class="win-box">
              <div class="win-title">Canlar bitti 💔</div>
              <div id="failStats"></div>
              <div class="win-actions">
                <button id="btnRetry" class="primary">Tekrar dene</button>
                <button id="btnFailList" class="chip">Level listesi</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="levels.js"></script>
  <script src="levels_gen.js"></script>
  <script src="js/board.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
